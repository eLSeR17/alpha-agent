name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
          pip install ruff==0.16.7

      - name: Lint with ruff
        run: |
          ruff check src tests scripts

      - name: Scan dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          # Fresh toolchain: the hosted runner's preinstalled setuptools 79.x is
          # flagged by PYSEC-2026-3447 (fixed in 83.0.0). setuptools is not a
          # project dependency — updating the build toolchain clears the advisory.
          pip install -U "setuptools>=83" pip
          pip-audit --desc on

      - name: Scan for leaked secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: |
          pytest tests/ -v --tb=short
